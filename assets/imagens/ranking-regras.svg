<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1230" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Como funciona o ranking do Beach Tennis Club</title>
  <desc id="d">Infográfico: pontos iniciais por nível, exemplos de ganho e perda de pontos, o que conta para o ranking, peso de jogos repetidos e pontos extras de torneio.</desc>
  <rect width="600" height="1230" rx="28" fill="#f6fbf8"/>
  <rect width="600" height="104" rx="28" fill="#0b3b46"/>
  <rect y="60" width="600" height="44" fill="#0b3b46"/>
  <circle cx="58" cy="52" r="26" fill="#ffc857"/>
  <path d="M40 40 q18 12 0 24 M76 40 q-18 12 0 24" stroke="#0b3b46" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="100" y="48" font-size="27" font-weight="800" fill="#ffffff">Como funciona o ranking</text>
  <text x="100" y="78" font-size="17" fill="#ffc857">Beach Tennis Club · pontos estilo Elo</text>

  <!-- 1 -->
  <circle cx="40" cy="146" r="18" fill="#ff7a5c"/><text x="40" y="153" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
  <text x="70" y="153" font-size="23" font-weight="800" fill="#0b3b46">Todo mundo começa pelo seu nível</text>
  <g>
    <rect x="30" y="236" width="170" height="64" rx="12" fill="#a8ecd9"/>
    <rect x="215" y="206" width="170" height="94" rx="12" fill="#6fd0cc"/>
    <rect x="400" y="176" width="170" height="124" rx="12" fill="#0a8793"/>
    <text x="115" y="262" text-anchor="middle" font-size="30" font-weight="800" fill="#0b3b46">1000</text>
    <text x="115" y="287" text-anchor="middle" font-size="16" fill="#0b3b46">Iniciante</text>
    <text x="300" y="242" text-anchor="middle" font-size="30" font-weight="800" fill="#0b3b46">1200</text>
    <text x="300" y="267" text-anchor="middle" font-size="16" fill="#0b3b46">Intermediário</text>
    <text x="485" y="222" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">1400</text>
    <text x="485" y="247" text-anchor="middle" font-size="16" fill="#ffffff">Avançado</text>
  </g>
  <text x="300" y="326" text-anchor="middle" font-size="16" fill="#4f6a72">Depois, os resultados dos jogos fazem os pontos subirem ou descerem.</text>

  <!-- 2 -->
  <circle cx="40" cy="376" r="18" fill="#ff7a5c"/><text x="40" y="383" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
  <text x="70" y="383" font-size="23" font-weight="800" fill="#0b3b46">Vencer um rival mais forte vale mais</text>
  <rect x="30" y="406" width="265" height="190" rx="18" fill="#ffffff" stroke="#d9e8e3"/>
  <text x="162" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#0b3b46">Você (1000) vence um 1200</text>
  <text x="162" y="500" text-anchor="middle" font-size="58" font-weight="800" fill="#13806a">+30</text>
  <text x="162" y="528" text-anchor="middle" font-size="16" fill="#4f6a72">pontos para você</text>
  <text x="162" y="566" text-anchor="middle" font-size="16" fill="#b3261e">o rival perde 30</text>
  <rect x="305" y="406" width="265" height="190" rx="18" fill="#ffffff" stroke="#d9e8e3"/>
  <text x="437" y="436" text-anchor="middle" font-size="17" font-weight="700" fill="#0b3b46">Você (1000) vence um 800</text>
  <text x="437" y="500" text-anchor="middle" font-size="58" font-weight="800" fill="#13806a">+10</text>
  <text x="437" y="528" text-anchor="middle" font-size="16" fill="#4f6a72">pontos para você</text>
  <text x="437" y="566" text-anchor="middle" font-size="16" fill="#b3261e">o rival perde 10</text>
  <text x="300" y="624" text-anchor="middle" font-size="15" fill="#4f6a72">Exemplos nos primeiros 10 jogos (fator 40). Depois o fator cai para 32.</text>
  <text x="300" y="646" text-anchor="middle" font-size="15" fill="#4f6a72">O que um ganha, o outro perde. A pontuação nunca fica abaixo de 0.</text>

  <!-- 3 -->
  <circle cx="40" cy="696" r="18" fill="#ff7a5c"/><text x="40" y="703" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
  <text x="70" y="703" font-size="23" font-weight="800" fill="#0b3b46">O que conta para o ranking</text>
  <rect x="30" y="724" width="540" height="56" rx="14" fill="#dff6f2"/>
  <circle cx="62" cy="752" r="14" fill="#13806a"/><path d="M55 752 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="758" font-size="18" fill="#0b3b46"><tspan font-weight="800">Vale ranking</tspan> e confirmado pelo adversário</text>
  <rect x="30" y="790" width="540" height="56" rx="14" fill="#fff1d1"/>
  <circle cx="62" cy="818" r="14" fill="#c98a12"/><path d="M55 811 l14 14 M69 811 l-14 14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="90" y="824" font-size="18" fill="#0b3b46"><tspan font-weight="800">Amistoso</tspan> não muda os pontos</text>
  <rect x="30" y="856" width="540" height="56" rx="14" fill="#fde8e6"/>
  <circle cx="62" cy="884" r="14" fill="#b3261e"/><path d="M55 877 l14 14 M69 877 l-14 14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="90" y="890" font-size="18" fill="#0b3b46"><tspan font-weight="800">Contestado</tspan> ou sem confirmação: não conta</text>

  <!-- 4 -->
  <circle cx="40" cy="962" r="18" fill="#ff7a5c"/><text x="40" y="969" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
  <text x="70" y="969" font-size="23" font-weight="800" fill="#0b3b46">Mesma pessoa na mesma semana</text>
  <text x="30" y="998" font-size="15" fill="#4f6a72">Jogar sempre com o mesmo adversário vale cada vez menos:</text>
  <rect x="30" y="1016" width="540" height="22" rx="11" fill="#e2ece8"/><rect x="30" y="1016" width="540" height="22" rx="11" fill="#0a8793"/>
  <text x="30" y="1060" font-size="16" fill="#0b3b46">1º e 2º jogo: <tspan font-weight="800">100% dos pontos</tspan></text>
  <rect x="30" y="1072" width="540" height="22" rx="11" fill="#e2ece8"/><rect x="30" y="1072" width="270" height="22" rx="11" fill="#6fd0cc"/>
  <text x="30" y="1116" font-size="16" fill="#0b3b46">3º e 4º jogo: <tspan font-weight="800">50%</tspan></text>
  <rect x="30" y="1128" width="540" height="22" rx="11" fill="#e2ece8"/><rect x="30" y="1128" width="135" height="22" rx="11" fill="#a8ecd9"/>
  <text x="30" y="1172" font-size="16" fill="#0b3b46">5º jogo em diante: <tspan font-weight="800">25%</tspan></text>

  <!-- 5 -->
  <rect x="30" y="1186" width="540" height="30" rx="15" fill="#0b3b46"/>
  <text x="300" y="1207" text-anchor="middle" font-size="16" fill="#ffc857" font-weight="700">Torneios: pódio ganha bônus · 1º +50 · 2º +30 · 3º +15</text>
</svg>
